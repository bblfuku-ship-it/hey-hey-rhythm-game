<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HEY! HEY! Mobile Rhythm</title>
<style>
:root{
  --judge:76%;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{overscroll-behavior:none}
#game{position:fixed;inset:0;background:radial-gradient(circle at 50% -10%,#3b2859 0,#171120 38%,#08070d 70%);overflow:hidden}
#hud{position:absolute;z-index:20;top:calc(10px + var(--safe-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 7px #000}
.hudbox{min-width:96px}
.label{font-size:10px;opacity:.62;letter-spacing:.14em}
.value{font-weight:900;font-size:22px}
#comboBox{text-align:right}
#field{position:absolute;left:0;right:0;top:0;bottom:calc(112px + var(--safe-bottom));overflow:hidden}
#lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
.lane{position:relative;border-right:1px solid #ffffff20;background:linear-gradient(to bottom,#ffffff08,transparent 45%)}
.lane:last-child{border-right:0}
.lane.flash{background:linear-gradient(to top,#ffffff40,transparent 58%)}
#judgeLine{position:absolute;left:0;right:0;top:var(--judge);height:4px;background:#fff;box-shadow:0 0 14px #fff,0 0 30px #ba78ff;z-index:8}
.note{position:absolute;height:18px;border-radius:9px;background:linear-gradient(90deg,#d7b6ff,#fff,#aee9ff);box-shadow:0 0 11px #fff8,0 0 24px #a96bffaa;z-index:6;will-change:transform}
#judgeText{position:absolute;z-index:30;left:50%;top:56%;transform:translate(-50%,-50%);font-size:clamp(34px,12vw,68px);font-weight:1000;letter-spacing:.05em;text-shadow:0 3px 0 #000,0 0 24px currentColor;opacity:0;pointer-events:none;white-space:nowrap}
#touchbar{position:absolute;z-index:50;left:0;right:0;bottom:0;height:calc(112px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ffffff38;background:#08070df2}
.pad{display:flex;align-items:center;justify-content:center;border-right:1px solid #ffffff24;font-weight:1000;font-size:28px;touch-action:none;user-select:none}
.pad:last-child{border-right:0}
.pad.active{background:#ffffff35;box-shadow:inset 0 10px 30px #ffffff1c}
.pad span{opacity:.9}
#progress{position:absolute;z-index:22;top:calc(52px + var(--safe-top));left:12px;right:12px;height:4px;border-radius:99px;overflow:hidden;background:#ffffff18}
#progressInner{height:100%;width:0;background:#fff}
.overlay{position:absolute;z-index:100;inset:0;background:#08070df2;display:flex;align-items:center;justify-content:center;padding:22px calc(20px + env(safe-area-inset-right,0px)) calc(22px + var(--safe-bottom)) calc(20px + env(safe-area-inset-left,0px))}
.card{width:min(520px,100%);padding:24px 20px;border:1px solid #ffffff25;border-radius:22px;background:#17131f;box-shadow:0 30px 80px #0009;text-align:center}
h1{font-size:28px;margin:0 0 10px}
p{line-height:1.65;margin:9px 0}
.small{font-size:12px;opacity:.68}
button{appearance:none;border:0;border-radius:999px;padding:15px 25px;margin-top:10px;background:#fff;color:#17131f;font-weight:1000;font-size:17px;min-width:180px}
button.alt{background:#ffffff15;color:#fff;border:1px solid #ffffff25}
#result{display:none}
.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.resultGrid div{padding:10px;border-radius:10px;background:#ffffff0d;text-align:left}
.rangeRow{margin:16px 0;text-align:left}
input[type=range]{width:100%}
#orientationHint{position:absolute;z-index:95;inset:0;display:none;align-items:center;justify-content:center;background:#08070df2;text-align:center;padding:30px}
@media (orientation:landscape) and (max-height:550px){
  #orientationHint{display:flex}
}
</style>
</head>
<body>
<div id="game">
  <div id="orientationHint"><div><h1>📱</h1><p>この試作は<strong>縦持ち</strong>で遊んでね。</p></div></div>

  <div id="hud">
    <div class="hudbox"><div class="label">SCORE</div><div class="value" id="score">0000000</div></div>
    <div class="hudbox" id="comboBox"><div class="label">COMBO</div><div class="value" id="combo">0</div></div>
  </div>
  <div id="progress"><div id="progressInner"></div></div>

  <div id="field">
    <div id="lanes">
      <div class="lane" data-lane="0"></div>
      <div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div>
      <div class="lane" data-lane="3"></div>
    </div>
    <div id="judgeLine"></div>
    <div id="judgeText"></div>
  </div>

  <div id="touchbar">
    <div class="pad" data-lane="0"><span>●</span></div>
    <div class="pad" data-lane="1"><span>●</span></div>
    <div class="pad" data-lane="2"><span>●</span></div>
    <div class="pad" data-lane="3"><span>●</span></div>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <h1>（_｣ﾟ∀ﾟ）｣ HEY！HEY！</h1>
      <p>スマホ4レーン試作版。<br><strong>画面下の4つのパッドを直接タップ。</strong></p>
      <p class="small">2本指の同時押しにも対応。</p>
      <div class="rangeRow">
        <div>判定調整：<strong id="offsetLabel">0 ms</strong></div>
        <input id="offset" type="range" min="-180" max="180" step="5" value="0">
        <div class="small">早く感じる → ＋ / 遅く感じる → －</div>
      </div>
      <button id="play">START</button><br>
      <button class="alt" id="choose">音源を選び直す</button>
      <input type="file" id="picker" accept="audio/*" hidden>
      <p class="small">Safari等で音源が自動で読めない場合だけ「音源を選び直す」を使ってね。</p>
    </div>
  </div>

  <div class="overlay" id="result">
    <div class="card">
      <h1>RESULT</h1>
      <p><span class="small">SCORE</span><br><strong style="font-size:34px" id="finalScore">0</strong></p>
      <p><span class="small">MAX COMBO</span><br><strong style="font-size:28px" id="maxCombo">0</strong></p>
      <div class="resultGrid">
        <div>PERFECT <strong id="rp">0</strong></div>
        <div>GREAT <strong id="rg">0</strong></div>
        <div>GOOD <strong id="rgo">0</strong></div>
        <div>MISS <strong id="rm">0</strong></div>
      </div>
      <button id="retry">もう一度</button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
(()=>{
const C=window.CHART_DATA;
const audio=document.getElementById('audio');
audio.src=C.audio;
const field=document.getElementById('field');
const scoreEl=document.getElementById('score');
const comboEl=document.getElementById('combo');
const jt=document.getElementById('judgeText');
const start=document.getElementById('start');
const result=document.getElementById('result');
const progress=document.getElementById('progressInner');
const pads=[...document.querySelectorAll('.pad')];
const laneEls=[...document.querySelectorAll('.lane')];
const slider=document.getElementById('offset');
const offsetLabel=document.getElementById('offsetLabel');

let offset=0,running=false,raf=0,notes=[],combo=0,maxCombo=0,score=0,resultShown=false;
let counts={perfect:0,great:0,good:0,miss:0};
const travel=1.65;

slider.addEventListener('input',()=>{
  offset=Number(slider.value)/1000;
  offsetLabel.textContent=slider.value+' ms';
});

function reset(){
  cancelAnimationFrame(raf);
  running=false; resultShown=false;
  audio.pause(); try{audio.currentTime=0}catch(e){}
  document.querySelectorAll('.note').forEach(e=>e.remove());
  notes=C.notes.map(n=>({...n,judged:false,el:null}));
  combo=0;maxCombo=0;score=0;
  counts={perfect:0,great:0,good:0,miss:0};
  scoreEl.textContent='0000000';comboEl.textContent='0';progress.style.width='0%';
  result.style.display='none';
}
function showJudge(text){
  jt.textContent=text;
  jt.style.color=text==='PERFECT'?'#fff':text==='GREAT'?'#bde9ff':text==='GOOD'?'#ffe39a':'#ff90a3';
  jt.style.opacity=1;
  clearTimeout(showJudge.t);
  showJudge.t=setTimeout(()=>jt.style.opacity=0,170);
}
function apply(note,type){
  if(note.judged)return;
  note.judged=true;
  if(note.el)note.el.remove();
  counts[type]++;
  if(type==='miss'){
    combo=0;showJudge('MISS');
  }else{
    combo++;maxCombo=Math.max(maxCombo,combo);
    const base=type==='perfect'?1000:type==='great'?700:400;
    score+=base+Math.min(combo,100)*3;
    showJudge(type.toUpperCase());
  }
  comboEl.textContent=combo;
  scoreEl.textContent=String(score).padStart(7,'0');
}
function hit(lane){
  if(!running)return;
  const t=audio.currentTime+offset;
  const c=notes.filter(n=>!n.judged&&n.lane===lane&&Math.abs(n.time-t)<=0.150);
  if(!c.length){
    combo=0;comboEl.textContent='0';showJudge('MISS');return;
  }
  c.sort((a,b)=>Math.abs(a.time-t)-Math.abs(b.time-t));
  const n=c[0],d=Math.abs(n.time-t);
  apply(n,d<=.05?'perfect':d<=.10?'great':'good');
}
function flash(lane,on){
  pads[lane].classList.toggle('active',on);
  laneEls[lane].classList.toggle('flash',on);
}
pads.forEach((pad,i)=>{
  const down=e=>{e.preventDefault();try{pad.setPointerCapture(e.pointerId)}catch(_){} flash(i,true);hit(i)};
  const up=e=>{e.preventDefault();flash(i,false)};
  pad.addEventListener('pointerdown',down,{passive:false});
  pad.addEventListener('pointerup',up,{passive:false});
  pad.addEventListener('pointercancel',up,{passive:false});
  pad.addEventListener('pointerleave',up,{passive:false});
});
function createNote(n){
  const el=document.createElement('div');
  el.className='note';
  const w=field.clientWidth/4;
  el.style.left=(n.lane*w+7)+'px';
  el.style.width=(w-14)+'px';
  field.appendChild(el);
  n.el=el;
}
function loop(){
  if(!running)return;
  const t=audio.currentTime+offset;
  const judgeY=field.clientHeight*.76;
  const spawnY=-28;
  for(const n of notes){
    if(n.judged)continue;
    const dt=n.time-t;
    if(dt<=travel&&dt>-.20&&!n.el)createNote(n);
    if(n.el){
      const p=1-dt/travel;
      const y=spawnY+p*(judgeY-spawnY);
      n.el.style.transform=`translateY(${y}px)`;
    }
    if(dt<-.150)apply(n,'miss');
    if(dt>travel+.05)break;
  }
  const dur=audio.duration||C.timing.audio_duration_seconds||260;
  progress.style.width=Math.min(100,audio.currentTime/dur*100)+'%';
  if((audio.ended||audio.currentTime>=dur-.05)&&!resultShown){finish();return}
  raf=requestAnimationFrame(loop);
}
function finish(){
  running=false;resultShown=true;cancelAnimationFrame(raf);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('maxCombo').textContent=maxCombo;
  document.getElementById('rp').textContent=counts.perfect;
  document.getElementById('rg').textContent=counts.great;
  document.getElementById('rgo').textContent=counts.good;
  document.getElementById('rm').textContent=counts.miss;
  result.style.display='flex';
}
async function startGame(){
  reset();
  start.style.display='none';
  try{
    // iOS needs playback started directly from this tap.
    await audio.play();
    running=true;
    loop();
  }catch(err){
    start.style.display='flex';
    alert('音源を開けなかったよ。「音源を選び直す」から hey_hey.mp3 を選んでね。');
  }
}
document.getElementById('play').addEventListener('click',startGame);
document.getElementById('retry').addEventListener('click',()=>{result.style.display='none';start.style.display='flex'});
const picker=document.getElementById('picker');
document.getElementById('choose').addEventListener('click',()=>picker.click());
picker.addEventListener('change',()=>{
  if(picker.files&&picker.files[0]){
    audio.src=URL.createObjectURL(picker.files[0]);
    document.getElementById('choose').textContent='音源を選択済み';
  }
});
document.addEventListener('contextmenu',e=>e.preventDefault());
reset();
})();
</script>

<script>
/* iPhone/Safari gameplay guard */
(() => {
  let lastTouchEnd = 0;
  document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 350) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(type => {
    document.addEventListener(type, e => e.preventDefault(), {passive:false});
  });
})();
</script>
